// Shared Android app-module configuration for every Nova game. A game's app/build.gradle sets
// ext.novaGameRoot (the game repo root) and ext.novaEngineDir, applies this script, then sets
// only its identity (applicationId, version, name, orientation, signing). Engine-wide Android
// changes (SDK/NDK levels, native build, SDL glue) therefore reach every game.

def gameRoot = project.ext.novaGameRoot
def engineDir = project.ext.novaEngineDir
// Release builds ship one encrypted game.pak, which the native build writes here.
def releasePackDir = "${gameRoot}/build/android-pack/release"

android {
    namespace = 'com.gamestudio.nova.host' // fixed; each game's applicationId is its real identity
    compileSdk 36
    ndkVersion = '28.2.13676358'

    defaultConfig {
        minSdk 24 // first Android version with Vulkan
        targetSdk 36
        manifestPlaceholders.put('novaRenderDriver', project.findProperty('novaRenderDriver') ?: '')
        externalNativeBuild {
            cmake {
                // libc++ is linked statically: libmain.so is the only C++ library in the APK.
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24',
                          "-DNOVA_ENGINE_DIR=${engineDir}"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments '-DNOVA_PACK_ASSETS=ON', "-DNOVA_ANDROID_PACK_DIR=${releasePackDir}"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "${gameRoot}/CMakeLists.txt"
            version '3.30.5'
            buildStagingDirectory "${gameRoot}/build/android-cxx"
        }
    }

    sourceSets.main {
        // SDL's Java glue comes straight from the engine's SDL submodule, plus NovaActivity.
        java.srcDirs += ["${engineDir}/third_party/SDL/android-project/app/src/main/java",
                         "${engineDir}/platforms/android/java"]
        assets.srcDirs = []
    }
    sourceSets.debug.assets.srcDirs = ["${gameRoot}/assets"]
    sourceSets.release.assets.srcDirs = [] // the pack arrives as generated assets (below)

    androidResources {
        noCompress 'pak' // read with seeks; already compressed and encrypted
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

// Copies the game.pak the native build wrote into a declared output folder, which release builds
// register as generated assets. Gradle then knows exactly when the pack changes, and wires every
// task that reads release assets (merge, lint, ...) after the native build.
abstract class NovaPackAssets extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getPackDir()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction void copyPack() {
        def out = outputDir.get().asFile
        out.deleteDir()
        out.mkdirs()
        def pak = packDir.file('game.pak').get().asFile
        if (!pak.exists()) throw new GradleException("No game.pak in ${packDir.get().asFile}; the native build should have made it")
        java.nio.file.Files.copy(pak.toPath(), new File(out, 'game.pak').toPath())
    }
}

def novaPackAssets = tasks.register('novaReleasePackAssets', NovaPackAssets) {
    packDir.set(file(releasePackDir))
    outputDir.set(layout.buildDirectory.dir('generated/nova-pack/release'))
    dependsOn 'externalNativeBuildRelease'
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(novaPackAssets, { it.outputDir })
    }
}

tasks.matching { it.name == 'externalNativeBuildRelease' }.configureEach { outputs.dir(releasePackDir) }
