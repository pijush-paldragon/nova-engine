org.gradle.jvmargs=-Xmx2048m

# Which game under games/ to build, and how it appears on the device.
novaGame=brickbreaker
novaApplicationId=com.gamestudio.brickbreaker
novaAppName=Brick Breaker
# Android screenOrientation value: sensorPortrait or sensorLandscape
novaOrientation=sensorPortrait
# Force a render backend for testing (vulkan, opengles2); leave empty for vulkan -> opengles2.
novaRenderDriver=

# AGP 8.7 (pinned by SDL's template) predates API 36; compiling against it is supported but warns.
android.suppressUnsupportedCompileSdk=36
